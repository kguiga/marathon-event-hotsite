<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maratona de São Paulo</title>
    
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="logo">Maratona de São Paulo</div>

        <nav>
            <a href="index.html">Início</a>
            <a href="inscricoes.html">Inscrições</a>
            <a href="cidade.html">A Cidade</a>
            <a href="maratonas.html">Maratonas</a>
            <a href="termo.html">Termo</a>
            <a href="faq.html">FAQ</a>
        </nav>
    </header>

    <main>

        <section class="banner">
            <h1>Maratona de São Paulo 2026</h1>

            <h2>Contagem Regressiva</h2>

            <div id="contador"></div>
        </section>

        <section class="slider">
            <img id="slide"
                 src="images/slide"
                 alt="Imagem da Maratona">
        </section>

    </main>

    <footer>
        <p>Maratona de São Paulo 2026</p>
    </footer>

    <script src="js/script.js"> 
    </script> 


   <script>
        const fotos = document.querySelectorAll(".foto");

        const modal = document.getElementById("modal");

        const imagemGrande =
        document.getElementById("imagemGrande");

        fotos.forEach(foto => {

            foto.addEventListener("click", () => {

                modal.style.display = "flex";

                imagemGrande.src = foto.src;
            });

        });

        modal.addEventListener("click", () => {

            modal.style.display = "none";

        });
    </script> 


</body>

</html>
